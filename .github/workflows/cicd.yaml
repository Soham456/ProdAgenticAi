name: EC2 Automated Continuous Deployment

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Self-Hosted EC2 Runner
    runs-on: self-hosted
    environment: s

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File from GitHub Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env

      - name: Build Docker Image
        run: |
          docker build -t prodagenticai:latest .

      - name: Stop & Remove Old Container
        run: |
          docker rm -f prodagenticai_app || true

      - name: Launch Updated Application Container
        run: |
          docker run -d \
            --name prodagenticai_app \
            --restart unless-stopped \
            -p 8501:8501 \
            --env-file .env \
            prodagenticai:latest

      - name: Verify Deployment Health
        run: |
          sleep 5
          docker ps --filter "name=prodagenticai_app"
          curl --fail http://localhost:8501/_stcore/health || exit 1
